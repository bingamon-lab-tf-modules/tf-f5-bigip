---
# Global

debug: false
quiet: false
insecure: false
timeout: 20m

# Database
db:
  skip-update: false
  no-progress: true
  repository:
    - "ghcr.io/tars-cloud/actions/trivy-db:2"
    - "ghcr.io/aquasecurity/trivy-db:2"
    - "docker.io/aquasec/trivy-db:2"
    - "public.ecr.aws/aquasecurity/trivy-db:2"

java-db:
  repository:
    - "ghcr.io/tars-cloud/actions/trivy-java-db:1"
    - "ghcr.io/aquasecurity/trivy-java-db:1"
    - "docker.io/aquasec/trivy-java-db:1"
    - "public.ecr.aws/aquasecurity/trivy-java-db:1"

# Report
exit-code: 1
format: table
report: all
severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

# Scan
scan:
  show-suppressed: false
  detection-priority: precise
  scanners:
    - vuln
    - misconfig
    - secret
    - license
  skip-files:
    - .env
  skip-dirs:
    - .devenv
    - .direnv
    - .git
    - .tars

# Package
pkg:
  include-dev-deps: true
  types:
    - os
    - library

# Misconfiguration
misconfiguration:
  terraform:
    exclude-downloaded-modules: false
  checks-bundle-repository: "ghcr.io/tars-cloud/actions/trivy-checks:2"
