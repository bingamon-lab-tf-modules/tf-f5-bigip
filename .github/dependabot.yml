---
##################################################
#
# Name: dependabot.yml
# Description: Dependabot configuration for GitHub native version
# Reference: https://git.io/JJhjE
#
##################################################

version: 2

updates:
  #########################
  # GitHub Actions
  #########################

  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "Australia/Sydney"
    assignees:
      - "MAHDTech"
    labels:
      - "actions"
      - "chore"
      - "dependabot"
      - "dependencies"
      - "semver none"
    target-branch: "trunk"
    commit-message:
      prefix: "github-actions"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    groups:
      tars-cloud-actions:
        patterns:
          - "tars-cloud/actions*"
    ignore:
      - dependency-name: "tars-cloud/actions*"
        update-types:
          - "version-update:semver-major"

    #########################
    # Terraform
    #########################

  - package-ecosystem: "terraform"
    directories:
      - "/module"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "Australia/Sydney"
    assignees:
      - "MAHDTech"
    labels:
      - "chore"
      - "dependabot"
      - "dependencies"
      - "opentofu"
      - "semver none"
      - "terraform"
    target-branch: "trunk"
    commit-message:
      prefix: "terraform"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
