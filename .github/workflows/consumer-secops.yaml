---
name: "Consumer: SecOps"

# prettier-ignore
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - master
      - trunk
  pull_request:
    branches:
      - main
      - master
      - trunk
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

concurrency:
  group: secops-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  security-events: write
  statuses: write

jobs:
  # -------------------------------------------------
  # Trivy Scan
  # -------------------------------------------------
  trivy:
    name: Trivy Scan
    uses: tars-cloud/actions/.github/workflows/consumer-trivy.yaml@2ff528f5c523bbdfabd988e6c3b12fd0fa50a7e0 # v3.13.3
    with:
      debug: false
      runner-architecture: AMD64
      type: devenv
      timeout-minutes: 120
      submodules: true
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
      config-file: auto
      use-database-mirrors: true
      fail-on-findings: false
      publish-status: true
      status-context: Trivy
    secrets:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}

  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/consumer-codeql.yaml@2ff528f5c523bbdfabd988e6c3b12fd0fa50a7e0 # v3.13.3
    with:
      debug: false
      runner-architecture: AMD64
      type: devenv
      timeout-minutes: 360
      languages: '["actions"]'
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
    secrets:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
