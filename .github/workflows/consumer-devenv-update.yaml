---
name: "Consumer: Devenv Update"

# prettier-ignore
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate dependency updates without creating a pull request
        type: boolean
        default: false

concurrency:
  group: devenv-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------
  # Update Devenv Dependencies
  # -------------------------------------------------
  update:
    name: Update Devenv Dependencies
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-update.yaml@26ffb67cc8d374672f646d6dd8829befa844b0e9 # v3.12.0
    with:
      debug: false
      runner-architecture: AMD64
      type: devenv
      submodules: true
      branch: update-devenv-lock
      title: "chore: Update devenv.lock"
      labels: dependencies,semver none
      assignees: MAHDTech
      reviewers: MAHDTech
      dry-run: ${{ inputs.dry_run || false }}
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-id: ${{ secrets.CI_APP_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
